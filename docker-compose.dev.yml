services:

  db:
    # Exposes port to the host so GUI tools (TablePlus, pgAdmin) can connect.
    # Other services reach 'db' by service name — they do not need this
    # port mapping. Environment-agnostic config (credentials, volumes,
    # depends_on) now lives in docker-compose.yml — nothing here needs it
    # to differ between dev and prod, so it doesn't live in two places.
    ports:
      - "5432:5432"

  keycloak:
    # 'start-dev' enables an in-memory-friendly dev mode (HTTP allowed, no
    # need for a real TLS cert locally). Never use start-dev in production —
    # it disables hostname/TLS checks that matter there (see
    # docker-compose.prod.yml's 'start' + KC_HOSTNAME/KC_PROXY_HEADERS).
    # '--import-realm' loads any realm JSON found in the import directory
    # (mounted in docker-compose.yml) on every startup, so the realm config
    # lives in git, not in admin-UI clicks that vanish when the container
    # is recreated.
    command: start-dev --import-realm
    # 8080: Keycloak's own HTTP port (login pages, token endpoint, JWKS).
    # Next.js and NestJS both reach it at http://localhost:8080 in dev —
    # direct access, bypassing Traefik entirely (dev doesn't run Traefik/
    # api/web through Docker at all; see docker-compose.yml's 'api' comment).
    # Prod reaches Keycloak through Traefik's '/auth' route instead, so it
    # never needs this port published anywhere.
    ports:
      - "8080:8080"

  vault:
    environment:
      # Dev mode's server auto-generates a root token unless one is given;
      # pinning it via .env means vault-bootstrap and vault-agent can both
      # reference the same known value instead of scraping container logs.
      # Prod has no equivalent of this at all — real Vault has no "dev
      # root token," it unseals via OCI KMS instead (see
      # docker-compose.prod.yml and infra/terraform/vault.tf).
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    # Lets you open http://localhost:8200 and use the Vault UI/CLI from the
    # host to poke around — not required for the app itself to work, and
    # not published anywhere in prod (nothing external needs to reach
    # Vault directly; see docker-compose.yml's db/vault reasoning).
    ports:
      - "8200:8200"

  vault-bootstrap:
    # Root-token auth — the dev-mode equivalent of prod's AppRole login
    # (see infra/vault/bootstrap-prod.sh). VAULT_ADDR/DB_PASSWORD are
    # identical either way, so they live in docker-compose.yml instead.
    environment:
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
    volumes:
      - ./infra/vault/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]

  vault-agent:
    # VAULT_TOKEN here is consumed by agent-entrypoint.sh, not by Vault
    # Agent itself — the entrypoint script bridges this env var into the
    # token file Agent's 'token_file' auto_auth method expects. Prod has no
    # equivalent: agent-prod.hcl's 'approle' method reads role_id/secret_id
    # files directly, no bridging script or token env var needed.
    environment:
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
    volumes:
      - ./infra/vault/agent.hcl:/vault/config/agent.hcl:ro
      - ./infra/vault/agent-entrypoint.sh:/agent-entrypoint.sh:ro
      - vault_token:/vault/token
    entrypoint: ["sh", "/agent-entrypoint.sh"]
