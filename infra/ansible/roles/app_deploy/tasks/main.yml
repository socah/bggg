---
# git itself isn't part of the 'docker' role's job — it's specifically
# what this role needs to get source onto the server, so it's installed
# here rather than bundled into a role that has nothing to do with it.
- name: Install git
  apt:
    name: git
    state: present

- name: Ensure /root/.ssh exists
  when: app_deploy_source == 'git'
  file:
    path: "{{ github_deploy_key_dest | dirname }}"
    state: directory
    mode: "0700"

# The private key itself is never in this repo — same pattern as
# SSH_KEY_PATH/TF_VAR_oci_private_key_path: it lives in Infisical and is
# fetched onto the operator's machine by infra/scripts/import-secrets.sh
# (as GITHUB_DEPLOY_KEY_PATH), then 'copy' pushes that local file over the
# same SSH connection Ansible already has open to the server — no new
# credential needed just to get the key onto the box.
# no_log: true keeps the key's contents out of Ansible's console/log
# output, same reasoning as duckdns's duckdns_token template task.
- name: Copy the GitHub deploy key to the server
  when: app_deploy_source == 'git'
  copy:
    src: "{{ lookup('ansible.builtin.env', 'GITHUB_DEPLOY_KEY_PATH') }}"
    dest: "{{ github_deploy_key_dest }}"
    mode: "0600"
  no_log: true

# '/opt/bggg' itself (deploy_dir) is owned by a different user than the
# one running this task (root, via 'become') — first noticed as git
# itself refusing to operate at all: "detected dubious ownership in
# repository at '/opt/bggg'". This is git's own CVE-2022-24765 mitigation,
# not a real compromise here — the fix it recommends is exactly this,
# telling git this one directory is trusted regardless of who owns it.
# Idempotent (checks the current value before writing), unlike a bare
# 'git config --global --add safe.directory ...' shell command, which
# would append a fresh duplicate line to root's ~/.gitconfig on every
# single deploy.
- name: Trust deploy_dir for git's ownership check
  when: app_deploy_source == 'git'
  community.general.git_config:
    name: safe.directory
    scope: global
    value: "{{ deploy_dir }}"

- name: Clone or update the application repo
  when: app_deploy_source == 'git'
  git:
    repo: "{{ app_repo }}"
    dest: "{{ deploy_dir }}"
    version: "{{ app_repo_version }}"
    key_file: "{{ github_deploy_key_dest }}"
    # Without this, the *first* connection from this server to
    # github.com would hang the same way the HTTPS clone did — git
    # stopping to ask "are you sure you want to continue connecting?"
    # with nothing there to type "yes" into. This tells the git module
    # to add github.com's host key automatically instead of prompting.
    accept_hostkey: true
    # A normal 'git pull' would refuse to run if the working tree had
    # local changes — force means this deploy always ends up exactly at
    # app_repo_version, discarding anything that (should never, but
    # could) have been hand-edited directly on the server.
    force: true

# 'ansible.posix.synchronize' shells out to the local 'rsync' binary
# itself rather than going through a normal Ansible module connection, so
# the remote side still needs a matching 'rsync' binary of its own to
# talk to — apt installs it here, same reasoning as 'Install git' above,
# only when it's actually going to be used.
- name: Install rsync
  when: app_deploy_source == 'local'
  apt:
    name: rsync
    state: present

# Debug-only alternative to the git clone above: rsyncs this checkout's
# own working tree (uncommitted changes included) straight to deploy_dir,
# so a fix can be tried on the real server without first committing and
# pushing it to GitHub. '--filter=:- .gitignore' makes rsync honor every
# .gitignore in the tree the same way git itself would (node_modules/,
# .env, Terraform state, etc. never get synced); '--exclude=.git' drops
# the local repo's own git metadata, which the server has no use for and
# 'app_deploy_source: git' deploys never create there in the first place.
# 'delete: true' mirrors the git task's own 'force: true' above — the
# server ends up exactly matching this working tree, not a superset of it.
#
# 'become: false' on the task itself is deliberate, not an oversight:
# 'synchronize' runs rsync as a *local* process on the controller that
# then opens its own ssh connection to the remote side — Ansible's normal
# per-task become (which affects module *execution* on the remote host)
# has no effect on that separate process, so privilege on the remote side
# has to be requested from rsync itself instead, via '--rsync-path=sudo
# rsync' (relies on the same passwordless sudo for ansible_user that every
# other 'become: true' task in this playbook already assumes).
- name: Sync the local working tree to the server (debug only)
  when: app_deploy_source == 'local'
  become: false
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ deploy_dir }}"
    delete: true
    # Dedicated module param, not another rsync_opts entry: the module
    # builds its rsync command by joining every arg into one shell string
    # (see its own source), so an rsync_opts value containing a bare space
    # — like 'sudo rsync' — would get split into two separate shell words
    # instead of staying one argument. rsync_path is shlex-quoted by the
    # module itself before being joined in, which sidesteps that entirely.
    rsync_path: "sudo rsync"
    rsync_opts:
      # Same space-splitting hazard as above, hence the embedded single
      # quotes here: without them, '.gitignore' would land as its own
      # shell word (a bogus extra source path) instead of staying part of
      # this one filter argument.
      - "--filter=':- .gitignore'"
      - "--exclude=.git"

- name: Ensure the vault config directory exists
  file:
    path: "{{ vault_config_dir }}"
    state: directory
    mode: "0700"

# Not secret — an OCID and two HTTPS endpoint URLs, not credentials (see
# infra/terraform/vault.tf's own outputs.tf comment). Read the same way
# generate_inventory.sh already reads app_server_public_ip: this assumes
# 'terraform apply' has already run, exactly like that script does.
#
# Conditional: skipped when these were already supplied via '-e' (see
# defaults/main.yml's comment on why). Without this guard, CI's
# .github/workflows/ci.yml run would still hit this task and try to shell
# out to a Terraform working directory the runner never initialized —
# extra-vars already winning over whatever set_fact computed wouldn't save
# it, since the lookup itself fails before any value is even assigned.
#
# No longer rendered into a file (an earlier version of this role
# templated these three into infra/vault/vault-server-prod.hcl.j2) — they
# now flow straight into "Build and start the stack"'s own environment:
# block below, matching docker-compose.prod.yml's 'vault' service reading
# them as VAULT_OCIKMS_SEAL_KEY_ID/etc. env vars instead of HCL config,
# which sidesteps a documented Vault parsing bug for 'key_id' in the
# config-file form (see vault-server-prod.hcl's own header comment).
- name: Read Vault's OCI KMS config from Terraform outputs
  when: vault_kms_key_id | length == 0
  set_fact:
    vault_kms_key_id: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' + playbook_dir + '/../terraform output -raw vault_unseal_key_id') }}"
    vault_kms_crypto_endpoint: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' + playbook_dir + '/../terraform output -raw vault_kms_crypto_endpoint') }}"
    vault_kms_management_endpoint: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' + playbook_dir + '/../terraform output -raw vault_kms_management_endpoint') }}"

# Unconditional now, deliberately — this used to skip entirely when the
# four vars were still empty (their defaults/main.yml default, before
# infra/vault/bootstrap-prod-init.sh has ever run). That was wrong: Docker
# auto-creates an empty *directory* at a bind-mount source path that
# doesn't exist yet, when docker-compose.prod.yml's volumes: entries for
# these same four paths expect a *file* — so the very first 'docker
# compose up' silently left a directory sitting at each path, which would
# make a later 'copy' here fail outright ("is a directory") the day real
# credentials finally do get delivered. Writing an empty file instead
# means the bind-mount source is always a real (if empty) file from the
# very first deploy onward — vault-agent/vault-bootstrap still fail to log
# in with empty credentials either way, exactly as intended until
# bootstrap-prod-init.sh has run, just without leaving a landmine behind.
- name: Deliver Vault Agent's AppRole credentials
  no_log: true
  block:
    - name: Remove any phantom directory Docker left at these paths
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ vault_config_dir }}/vault-agent-role_id"
        - "{{ vault_config_dir }}/vault-agent-secret_id"
    - name: Write vault-agent's role_id
      copy:
        content: "{{ vault_agent_role_id }}"
        dest: "{{ vault_config_dir }}/vault-agent-role_id"
        mode: "0600"
    - name: Write vault-agent's secret_id
      copy:
        content: "{{ vault_agent_secret_id }}"
        dest: "{{ vault_config_dir }}/vault-agent-secret_id"
        mode: "0600"

- name: Deliver Vault Bootstrap's AppRole credentials
  no_log: true
  block:
    - name: Remove any phantom directory Docker left at these paths
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ vault_config_dir }}/vault-bootstrap-role_id"
        - "{{ vault_config_dir }}/vault-bootstrap-secret_id"
    - name: Write vault-bootstrap's role_id
      copy:
        content: "{{ vault_bootstrap_role_id }}"
        dest: "{{ vault_config_dir }}/vault-bootstrap-role_id"
        mode: "0600"
    - name: Write vault-bootstrap's secret_id
      copy:
        content: "{{ vault_bootstrap_secret_id }}"
        dest: "{{ vault_config_dir }}/vault-bootstrap-secret_id"
        mode: "0600"

# Decision: generate a fresh random password on every single deploy run
# rather than checking first whether one's needed. Because: infra/vault/
# bootstrap.sh (see its own guard) already refuses to overwrite a secret
# that exists — so generating one we might not end up using costs nothing
# and keeps this role simpler than adding an Ansible-side check for the
# same thing the script already checks for itself. Alternative: inspect
# the 'bggg_db_data' Docker volume first and only generate when it's
# genuinely a first deploy. Drawback: two places would need to agree on
# what "already bootstrapped" means instead of one.
- name: Generate a candidate bootstrap password for this run
  # '/dev/null' as the lookup's cache path is a documented way to get a
  # fresh value every call — normally this lookup writes its result to a
  # file so repeated runs return the *same* password, which is exactly
  # what we don't want: nothing about this value is meant to persist
  # anywhere outside Vault itself.
  set_fact:
    bootstrap_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# Not a failure suppression — the task below is allowed to genuinely fail
# when this is the case (bootstrap-prod.sh's own bounded wait, see its
# comment, makes 'docker compose up' fail fast rather than hang, but it
# still fails). This just makes sure that failure's *reason* is visible
# up front, since the underlying container's own log line explaining why
# isn't something 'docker compose up's own error surfaces on its own.
- name: Warn if this deploy will only partially succeed
  debug:
    msg: >-
      vault_agent_role_id/vault_bootstrap_role_id are still unset — Vault
      hasn't been through its one-time init yet. The next task is expected
      to fail its vault-bootstrap -> vault-agent -> db/api dependency
      chain; keycloak/web/traefik still come up fine regardless. Run
      infra/vault/bootstrap-prod-init.sh once (see its own header for how),
      store its four values, then re-run this playbook with them supplied
      via '-e'.
  when: vault_agent_role_id | length == 0 or vault_bootstrap_role_id | length == 0

- name: Build and start the stack
  # '--env-file .env.prod' (relative to chdir, resolved against deploy_dir):
  # Compose would otherwise only auto-load a plain '.env', which doesn't
  # exist on the server at all — DOMAIN_NAME/LETSENCRYPT_EMAIL/etc. would
  # silently interpolate to empty strings, which is exactly the bug that
  # sent Traefik's Host() routers to match nothing and Keycloak crash-
  # looping on a blank admin password. '.env.prod' carries the non-secret
  # half of that config, committed (see its own header comment); the
  # secret half comes in below instead.
  command: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_USER: "{{ db_user }}"
    DB_NAME: "{{ db_name }}"
    DB_PASSWORD: "{{ bootstrap_db_password }}"
    # Read compose-side by docker-compose.prod.yml's 'vault' service as
    # ${VAULT_KMS_KEY_ID}/etc. — see that file's own comment for why these
    # are environment variables on the container rather than values baked
    # into infra/vault/vault-server-prod.hcl.
    VAULT_KMS_KEY_ID: "{{ vault_kms_key_id }}"
    VAULT_KMS_CRYPTO_ENDPOINT: "{{ vault_kms_crypto_endpoint }}"
    VAULT_KMS_MANAGEMENT_ENDPOINT: "{{ vault_kms_management_endpoint }}"
    # Secrets/PII, never in .env.prod — see defaults/main.yml's own comment
    # on these for where they actually come from (Infisical, via '-e').
    KEYCLOAK_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
    KEYCLOAK_DB_PASSWORD: "{{ keycloak_db_password }}"
    KEYCLOAK_API_SERVICE_SECRET: "{{ keycloak_api_service_secret }}"
    LETSENCRYPT_EMAIL: "{{ letsencrypt_email }}"
    AUTH_SECRET: "{{ auth_secret }}"
    AUTH_KEYCLOAK_SECRET: "{{ auth_keycloak_secret }}"
    BGG_API_TOKEN: "{{ bgg_api_token }}"
    R2_ENDPOINT: "{{ r2_endpoint }}"
    R2_ACCESS_KEY_ID: "{{ r2_access_key_id }}"
    R2_SECRET_ACCESS_KEY: "{{ r2_secret_access_key }}"
    VAPID_SUBJECT: "{{ vapid_subject }}"
    VAPID_PUBLIC_KEY: "{{ vapid_public_key }}"
    VAPID_PRIVATE_KEY: "{{ vapid_private_key }}"
  # This task's own env vars exist only for the lifetime of this one SSH
  # command — they're never written to a file on the server, so
  # bootstrap_db_password doesn't linger anywhere after 'docker compose
  # up' returns, whether or not bootstrap.sh actually used it.
  no_log: true

# Compose only recreates a container when its OWN declared config changes
# (image, command, environment, mount specs) — it has no way to notice
# that the *contents* of a bind-mounted host file changed underneath an
# otherwise-identical service definition. Without this, delivering real
# AppRole credentials for the first time (or rotating them later) would
# silently have no effect: 'vault-bootstrap'/'vault-agent' would keep
# running whatever container instance was already up, still holding
# whatever they read at their last start. Safe to run on every deploy
# regardless: both scripts are already idempotent (see bootstrap-prod.sh's
# own guard), so recreating them when nothing actually changed just
# reruns a cheap no-op.
- name: Force vault-bootstrap and vault-agent to pick up current credential files
  # Same '--env-file .env.prod' as "Build and start the stack" above, for
  # the identical reason spelled out in the VAULT_KMS_* comment just below:
  # this invocation re-interpolates every service's config, not just the
  # two named here, so DOMAIN_NAME/KEYCLOAK_* have to resolve to their real
  # values here too or Traefik/Keycloak/api/web risk an unwanted recreate
  # down to blank.
  command: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate vault-bootstrap vault-agent
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    # This, not the main 'up' task above, is the invocation that actually
    # matters for DB_PASSWORD: 'up' alone wouldn't recreate vault-bootstrap
    # at all if its service config hasn't changed, so a freshly-generated
    # password from the main task would never reach a running container —
    # this --force-recreate is what actually delivers it, the first time
    # vault-bootstrap has real AppRole credentials to act on it with.
    DB_PASSWORD: "{{ bootstrap_db_password }}"
    # Needed here too, even though this task never names 'vault' itself:
    # 'docker compose up' re-interpolates every service's ${...} variables
    # from *this* command's own environment, not just the two services
    # named on the command line — without these three, 'vault's own
    # VAULT_OCIKMS_SEAL_KEY_ID/etc. (docker-compose.prod.yml) would
    # interpolate to empty strings here, which Compose sees as a config
    # change and recreates 'vault' to match — even though it was never
    # asked to — crash-looping it on the same "'key_id' not found" error
    # this project has already hit (and fixed) once before, in "Build and
    # start the stack" above.
    VAULT_KMS_KEY_ID: "{{ vault_kms_key_id }}"
    VAULT_KMS_CRYPTO_ENDPOINT: "{{ vault_kms_crypto_endpoint }}"
    VAULT_KMS_MANAGEMENT_ENDPOINT: "{{ vault_kms_management_endpoint }}"
    # Same reasoning, same secrets/PII, as the main 'up' task above.
    KEYCLOAK_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
    KEYCLOAK_DB_PASSWORD: "{{ keycloak_db_password }}"
    KEYCLOAK_API_SERVICE_SECRET: "{{ keycloak_api_service_secret }}"
    LETSENCRYPT_EMAIL: "{{ letsencrypt_email }}"
    AUTH_SECRET: "{{ auth_secret }}"
    AUTH_KEYCLOAK_SECRET: "{{ auth_keycloak_secret }}"
    BGG_API_TOKEN: "{{ bgg_api_token }}"
    R2_ENDPOINT: "{{ r2_endpoint }}"
    R2_ACCESS_KEY_ID: "{{ r2_access_key_id }}"
    R2_SECRET_ACCESS_KEY: "{{ r2_secret_access_key }}"
    VAPID_SUBJECT: "{{ vapid_subject }}"
    VAPID_PUBLIC_KEY: "{{ vapid_public_key }}"
    VAPID_PRIVATE_KEY: "{{ vapid_private_key }}"
  no_log: true

# --import-realm deliberately skips realms that already exist, so changing the
# checked-in user profile alone cannot repair production. Apply the profile via
# the Admin API on every deploy; the PUT is idempotent and also covers fresh
# installations.
- name: Reconcile Keycloak user profile
  command: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T keycloak /bin/sh /sync-user-profile.sh
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    KEYCLOAK_DB_PASSWORD: "{{ keycloak_db_password }}"
  changed_when: false
  no_log: true

# 'db' has no healthcheck of its own (same gap Makefile's own 'migrate'
# target works around) — 'api' being up (the task above) doesn't mean
# Postgres inside 'db' is actually accepting connections yet, so the
# migration task below needs its own wait, not just a dependency on 'api'
# having started.
- name: Wait for Postgres to accept connections
  command: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T db pg_isready -U "{{ db_user }}"
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_USER: "{{ db_user }}"
    DB_NAME: "{{ db_name }}"
    DB_PASSWORD: "{{ bootstrap_db_password }}"
    VAULT_KMS_KEY_ID: "{{ vault_kms_key_id }}"
    VAULT_KMS_CRYPTO_ENDPOINT: "{{ vault_kms_crypto_endpoint }}"
    VAULT_KMS_MANAGEMENT_ENDPOINT: "{{ vault_kms_management_endpoint }}"
    KEYCLOAK_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
    KEYCLOAK_DB_PASSWORD: "{{ keycloak_db_password }}"
    KEYCLOAK_API_SERVICE_SECRET: "{{ keycloak_api_service_secret }}"
    LETSENCRYPT_EMAIL: "{{ letsencrypt_email }}"
    AUTH_SECRET: "{{ auth_secret }}"
    AUTH_KEYCLOAK_SECRET: "{{ auth_keycloak_secret }}"
    BGG_API_TOKEN: "{{ bgg_api_token }}"
    R2_ENDPOINT: "{{ r2_endpoint }}"
    R2_ACCESS_KEY_ID: "{{ r2_access_key_id }}"
    R2_SECRET_ACCESS_KEY: "{{ r2_secret_access_key }}"
    VAPID_SUBJECT: "{{ vapid_subject }}"
    VAPID_PUBLIC_KEY: "{{ vapid_public_key }}"
    VAPID_PRIVATE_KEY: "{{ vapid_private_key }}"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  no_log: true

# This is the step that would have caught today's incident before it ever
# reached a user: 'is_solo' shipped in the entity/schema.sql but the
# equivalent hand-run SQL never happened against the real prod database —
# see docs/superpowers/specs/2026-08-18-typeorm-migrations-design.md and
# apps/api/src/migrations/'s baseline migration for the full story. Runs
# via plain 'node' against the *compiled* data-source.js, not
# 'typeorm-ts-node-commonjs' the way 'make migrate' runs it in dev: the
# runtime image's build stage prunes devDependencies and removes npm/npx
# entirely (see apps/api/Dockerfile), so neither ts-node nor an npm script
# is available inside this container — only 'node' and whatever survived
# 'npm prune --omit=dev' (typeorm itself is a normal dependency, so its
# CLI entrypoint is still there). Paths are relative to the container's
# own WORKDIR (/workspace, see the Dockerfile), matching how 'CMD ["node",
# "apps/api/dist/main.js"]' addresses the same tree.
- name: Run database migrations
  command: >-
    docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod
    run --rm --no-deps api node node_modules/typeorm/cli.js migration:run -d apps/api/dist/data-source.js
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_USER: "{{ db_user }}"
    DB_NAME: "{{ db_name }}"
    DB_PASSWORD: "{{ bootstrap_db_password }}"
    VAULT_KMS_KEY_ID: "{{ vault_kms_key_id }}"
    VAULT_KMS_CRYPTO_ENDPOINT: "{{ vault_kms_crypto_endpoint }}"
    VAULT_KMS_MANAGEMENT_ENDPOINT: "{{ vault_kms_management_endpoint }}"
    KEYCLOAK_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
    KEYCLOAK_DB_PASSWORD: "{{ keycloak_db_password }}"
    KEYCLOAK_API_SERVICE_SECRET: "{{ keycloak_api_service_secret }}"
    LETSENCRYPT_EMAIL: "{{ letsencrypt_email }}"
    AUTH_SECRET: "{{ auth_secret }}"
    AUTH_KEYCLOAK_SECRET: "{{ auth_keycloak_secret }}"
    BGG_API_TOKEN: "{{ bgg_api_token }}"
    R2_ENDPOINT: "{{ r2_endpoint }}"
    R2_ACCESS_KEY_ID: "{{ r2_access_key_id }}"
    R2_SECRET_ACCESS_KEY: "{{ r2_secret_access_key }}"
    VAPID_SUBJECT: "{{ vapid_subject }}"
    VAPID_PUBLIC_KEY: "{{ vapid_public_key }}"
    VAPID_PRIVATE_KEY: "{{ vapid_private_key }}"
  changed_when: true
  no_log: true
