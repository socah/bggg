---
# git itself isn't part of the 'docker' role's job — it's specifically
# what this role needs to get source onto the server, so it's installed
# here rather than bundled into a role that has nothing to do with it.
- name: Install git
  apt:
    name: git
    state: present

- name: Ensure /root/.ssh exists
  file:
    path: "{{ github_deploy_key_dest | dirname }}"
    state: directory
    mode: "0700"

# The private key itself is never in this repo — same pattern as
# SSH_KEY_PATH/TF_VAR_oci_private_key_path: it lives in Infisical and is
# fetched onto the operator's machine by infra/scripts/import-secrets.sh
# (as GITHUB_DEPLOY_KEY_PATH), then 'copy' pushes that local file over the
# same SSH connection Ansible already has open to the server — no new
# credential needed just to get the key onto the box.
# no_log: true keeps the key's contents out of Ansible's console/log
# output, same reasoning as duckdns's duckdns_token template task.
- name: Copy the GitHub deploy key to the server
  copy:
    src: "{{ lookup('ansible.builtin.env', 'GITHUB_DEPLOY_KEY_PATH') }}"
    dest: "{{ github_deploy_key_dest }}"
    mode: "0600"
  no_log: true

- name: Clone or update the application repo
  git:
    repo: "{{ app_repo }}"
    dest: "{{ deploy_dir }}"
    version: "{{ app_repo_version }}"
    key_file: "{{ github_deploy_key_dest }}"
    # Without this, the *first* connection from this server to
    # github.com would hang the same way the HTTPS clone did — git
    # stopping to ask "are you sure you want to continue connecting?"
    # with nothing there to type "yes" into. This tells the git module
    # to add github.com's host key automatically instead of prompting.
    accept_hostkey: true
    # A normal 'git pull' would refuse to run if the working tree had
    # local changes — force means this deploy always ends up exactly at
    # app_repo_version, discarding anything that (should never, but
    # could) have been hand-edited directly on the server.
    force: true

- name: Ensure the vault config directory exists
  file:
    path: "{{ vault_config_dir }}"
    state: directory
    mode: "0700"

# Not secret — an OCID and two HTTPS endpoint URLs, not credentials (see
# infra/terraform/vault.tf's own outputs.tf comment). Read the same way
# generate_inventory.sh already reads app_server_public_ip: this assumes
# 'terraform apply' has already run, exactly like that script does.
#
# Conditional: skipped when these were already supplied via '-e' (see
# defaults/main.yml's comment on why). Without this guard, CI's
# .github/workflows/ci.yml run would still hit this task and try to shell
# out to a Terraform working directory the runner never initialized —
# extra-vars already winning over whatever set_fact computed wouldn't save
# it, since the lookup itself fails before any value is even assigned.
- name: Read Vault's OCI KMS config from Terraform outputs
  when: vault_kms_key_id | length == 0
  set_fact:
    vault_kms_key_id: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' + playbook_dir + '/../terraform output -raw vault_unseal_key_id') }}"
    vault_kms_crypto_endpoint: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' + playbook_dir + '/../terraform output -raw vault_kms_crypto_endpoint') }}"
    vault_kms_management_endpoint: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' + playbook_dir + '/../terraform output -raw vault_kms_management_endpoint') }}"

- name: Render the Vault server config
  template:
    # Not under this role's own templates/ dir: infra/vault/ is shared,
    # non-role-specific config (agent.hcl, the policies, the bootstrap
    # scripts all live there too) — same 'playbook_dir'-relative pattern
    # already used above for reading Terraform's outputs.
    src: "{{ playbook_dir }}/../vault/vault-server-prod.hcl.j2"
    dest: "{{ vault_config_dir }}/vault-server.hcl"
    # 0644, not 0600: the Vault image's own entrypoint drops from root to
    # a non-root user before running 'vault server' (unlike vault-agent/
    # vault-bootstrap, whose entrypoint is overridden directly, bypassing
    # that — see agent-prod.hcl/bootstrap-prod.sh), so a root-owned 0600
    # file is unreadable to the process that actually needs it. Safe to
    # widen: this file's contents are non-secret (an OCID and two HTTPS
    # endpoint URLs, matching infra/terraform/vault.tf's own reasoning),
    # unlike the AppRole credential files below.
    mode: "0644"

# Unconditional now, deliberately — this used to skip entirely when the
# four vars were still empty (their defaults/main.yml default, before
# infra/vault/bootstrap-prod-init.sh has ever run). That was wrong: Docker
# auto-creates an empty *directory* at a bind-mount source path that
# doesn't exist yet, when docker-compose.prod.yml's volumes: entries for
# these same four paths expect a *file* — so the very first 'docker
# compose up' silently left a directory sitting at each path, which would
# make a later 'copy' here fail outright ("is a directory") the day real
# credentials finally do get delivered. Writing an empty file instead
# means the bind-mount source is always a real (if empty) file from the
# very first deploy onward — vault-agent/vault-bootstrap still fail to log
# in with empty credentials either way, exactly as intended until
# bootstrap-prod-init.sh has run, just without leaving a landmine behind.
- name: Deliver Vault Agent's AppRole credentials
  no_log: true
  block:
    - name: Remove any phantom directory Docker left at these paths
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ vault_config_dir }}/vault-agent-role_id"
        - "{{ vault_config_dir }}/vault-agent-secret_id"
    - name: Write vault-agent's role_id
      copy:
        content: "{{ vault_agent_role_id }}"
        dest: "{{ vault_config_dir }}/vault-agent-role_id"
        mode: "0600"
    - name: Write vault-agent's secret_id
      copy:
        content: "{{ vault_agent_secret_id }}"
        dest: "{{ vault_config_dir }}/vault-agent-secret_id"
        mode: "0600"

- name: Deliver Vault Bootstrap's AppRole credentials
  no_log: true
  block:
    - name: Remove any phantom directory Docker left at these paths
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ vault_config_dir }}/vault-bootstrap-role_id"
        - "{{ vault_config_dir }}/vault-bootstrap-secret_id"
    - name: Write vault-bootstrap's role_id
      copy:
        content: "{{ vault_bootstrap_role_id }}"
        dest: "{{ vault_config_dir }}/vault-bootstrap-role_id"
        mode: "0600"
    - name: Write vault-bootstrap's secret_id
      copy:
        content: "{{ vault_bootstrap_secret_id }}"
        dest: "{{ vault_config_dir }}/vault-bootstrap-secret_id"
        mode: "0600"

# Decision: generate a fresh random password on every single deploy run
# rather than checking first whether one's needed. Because: infra/vault/
# bootstrap.sh (see its own guard) already refuses to overwrite a secret
# that exists — so generating one we might not end up using costs nothing
# and keeps this role simpler than adding an Ansible-side check for the
# same thing the script already checks for itself. Alternative: inspect
# the 'bggg_db_data' Docker volume first and only generate when it's
# genuinely a first deploy. Drawback: two places would need to agree on
# what "already bootstrapped" means instead of one.
- name: Generate a candidate bootstrap password for this run
  # '/dev/null' as the lookup's cache path is a documented way to get a
  # fresh value every call — normally this lookup writes its result to a
  # file so repeated runs return the *same* password, which is exactly
  # what we don't want: nothing about this value is meant to persist
  # anywhere outside Vault itself.
  set_fact:
    bootstrap_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# Not a failure suppression — the task below is allowed to genuinely fail
# when this is the case (bootstrap-prod.sh's own bounded wait, see its
# comment, makes 'docker compose up' fail fast rather than hang, but it
# still fails). This just makes sure that failure's *reason* is visible
# up front, since the underlying container's own log line explaining why
# isn't something 'docker compose up's own error surfaces on its own.
- name: Warn if this deploy will only partially succeed
  debug:
    msg: >-
      vault_agent_role_id/vault_bootstrap_role_id are still unset — Vault
      hasn't been through its one-time init yet. The next task is expected
      to fail its vault-bootstrap -> vault-agent -> db/api dependency
      chain; keycloak/web/traefik still come up fine regardless. Run
      infra/vault/bootstrap-prod-init.sh once (see its own header for how),
      store its four values, then re-run this playbook with them supplied
      via '-e'.
  when: vault_agent_role_id | length == 0 or vault_bootstrap_role_id | length == 0

- name: Build and start the stack
  command: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_USER: "{{ db_user }}"
    DB_NAME: "{{ db_name }}"
    DB_PASSWORD: "{{ bootstrap_db_password }}"
  # This task's own env vars exist only for the lifetime of this one SSH
  # command — they're never written to a file on the server, so
  # bootstrap_db_password doesn't linger anywhere after 'docker compose
  # up' returns, whether or not bootstrap.sh actually used it.
  no_log: true

# Compose only recreates a container when its OWN declared config changes
# (image, command, environment, mount specs) — it has no way to notice
# that the *contents* of a bind-mounted host file changed underneath an
# otherwise-identical service definition. Without this, delivering real
# AppRole credentials for the first time (or rotating them later) would
# silently have no effect: 'vault-bootstrap'/'vault-agent' would keep
# running whatever container instance was already up, still holding
# whatever they read at their last start. Safe to run on every deploy
# regardless: both scripts are already idempotent (see bootstrap-prod.sh's
# own guard), so recreating them when nothing actually changed just
# reruns a cheap no-op.
- name: Force vault-bootstrap and vault-agent to pick up current credential files
  command: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate vault-bootstrap vault-agent
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    # This, not the main 'up' task above, is the invocation that actually
    # matters for DB_PASSWORD: 'up' alone wouldn't recreate vault-bootstrap
    # at all if its service config hasn't changed, so a freshly-generated
    # password from the main task would never reach a running container —
    # this --force-recreate is what actually delivers it, the first time
    # vault-bootstrap has real AppRole credentials to act on it with.
    DB_PASSWORD: "{{ bootstrap_db_password }}"
  no_log: true
