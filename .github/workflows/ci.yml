name: CI

# Push to main is what actually deploys (see the 'deploy' job's 'if:' below).
# The pull_request trigger is what actually blocks bad code from merging —
# it runs the same gates against the PR's branch *before* it can reach main,
# giving a red X on the PR itself instead of a broken main branch after the fact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decision: lint + test + npm audit share ONE job (matrixed per workspace)
  # rather than three separate jobs. Because: all three need the exact same
  # 'npm ci' first — splitting them into separate jobs would mean paying for
  # that install twice (or three times) per workspace for no benefit, since
  # none of the three depend on each other's output.
  verify:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false means api's lint failing doesn't cancel web's job
      # mid-run — you get both results instead of one being marked "cancelled".
      fail-fast: false
      matrix:
        workspace: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Caches ~/.npm keyed on package-lock.json's hash (root-level lockfile,
          # since this is an npm workspaces monorepo — one lockfile for both apps).
          cache: 'npm'

      # Same install shape as apps/api/Dockerfile and apps/web/Dockerfile use
      # ('--workspace=X --include-workspace-root') — one workspace's deps only,
      # plus the root package.json workspaces needs to resolve at all.
      - run: npm ci --workspace=apps/${{ matrix.workspace }} --include-workspace-root

      - run: npm run lint --workspace=apps/${{ matrix.workspace }}

      # apps/web has no "test" script (only "lint") — Next.js's own build is
      # its type/compile check, and no unit tests exist for it yet. Running
      # 'npm run test' unconditionally here would fail on web with
      # "missing script: test", not a real test failure.
      - name: Unit tests
        if: matrix.workspace == 'api'
        run: npm run test --workspace=apps/api

      - name: E2E tests
        if: matrix.workspace == 'api'
        run: npm run test:e2e --workspace=apps/api

      # audit-level=high per references/secops.md's Dependency Scanning
      # checklist — fails the job (non-zero exit) on any high or critical
      # advisory in this workspace's resolved dependency tree.
      - name: npm audit (high+critical)
        run: npm audit --workspace=apps/${{ matrix.workspace }} --audit-level=high

  # Decision: a separate job from 'verify', not extra steps tacked onto it.
  # Because: this needs Buildx set up and actually builds a full image
  # (multi-stage, several minutes) — kept separate, it runs concurrently
  # with 'verify' instead of queuing behind it, so a fast lint failure still
  # surfaces immediately rather than waiting on a slow image build.
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: api
            dockerfile: apps/api/Dockerfile
          - workspace: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          # Root context, same as docker-compose.yml's 'build.context: .' for
          # both services — these Dockerfiles COPY root-level package.json
          # and package-lock.json, so the build context must be the repo root,
          # not apps/${{ matrix.workspace }}.
          context: .
          file: ${{ matrix.dockerfile }}
          tags: bggg-${{ matrix.workspace }}:ci
          # load: true puts the built image into this runner's local Docker
          # daemon so Trivy (next step) can scan it. Nothing is pushed to any
          # registry — this project has none; the production server builds
          # its own image from source, this is purely a CI-time quality gate.
          load: true

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bggg-${{ matrix.workspace }}:ci
          # Same Dockerfile the production VM will build from — a CRITICAL
          # finding here means the real deploy would produce the same
          # vulnerable image, not just this CI run.
          severity: CRITICAL
          # Non-zero exit on any match — this is what actually fails the job.
          # Without it, trivy-action only prints a report and the job goes green.
          exit-code: '1'

  deploy:
    runs-on: ubuntu-latest
    # Blocks on BOTH prior jobs (and both matrix legs of each) — a critical
    # CVE in apps/web's image, or a failing apps/api unit test, stops this
    # job exactly the same way.
    needs: [verify, build-and-scan]
    # Second gate, independent of 'needs': even when every check above is
    # green, only a push to main should ever touch production. Without this,
    # a green pull_request run (e.g. from a fork) could deploy on its own.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Decision: fetch everything below (R2 backend creds, AppRole
      # credentials) from Infisical, not as separate GitHub Secrets each —
      # matching infra/scripts/import-secrets.sh's own Universal Auth
      # branch, which this project already built specifically so "the same
      # script run unattended (CI...)" would work. /ENV_VARS is the exact
      # path bootstrap-prod-init.sh already tells you to store the four
      # AppRole values in, and where AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/
      # AWS_ENDPOINT_URL_S3 already live for local use — one login gets all
      # seven values as plain env vars for every step below, with only 2
      # GitHub Secrets (the Universal Auth identity itself) instead of 7.
      # A secret rotated in Infisical is live here on the next run with
      # nothing to update in this file or GitHub's Secrets UI — one place
      # to look, not two that can quietly drift apart (same reasoning as
      # nsg.tf's single-firewall-mechanism decision).
      #
      # A few values under /ENV_VARS (SSH_KEY_PATH, GITHUB_DEPLOY_KEY_PATH,
      # TF_VAR_oci_private_key_path, ...) are for a developer's own machine
      # and go unused here — harmless, and simpler than carving this path
      # up further.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: bggg-bq-ji
          env-slug: dev
          secret-path: /ENV_VARS
          export-type: env

      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to match the version this project's devcontainer runs —
          # same reasoning as pinning image tags in docker-compose.yml.
          terraform_version: '1.15.8'
          # The wrapper script setup-terraform installs by default captures
          # stdout/stderr into its own job outputs — helpful for some
          # workflows, but it gets in the way of a plain '$(terraform output
          # -raw ...)' capture in a 'run:' step below. Disabling it gives
          # back a normal terraform binary that behaves exactly like it
          # does on a developer's own machine.
          terraform_wrapper: false

      # Decision: read real Terraform state (this project's remote backend
      # is Cloudflare R2, see infra/terraform/backend.tf) instead of the
      # hand-maintained PROD_HOST secret this step used before. Because:
      # 'terraform output' only needs backend credentials to read
      # already-applied state — it doesn't refresh against OCI itself, so
      # no OCI provider credentials are needed here, only the three R2
      # values the s3 backend reads from the environment (already exported
      # above). This also gets the runner the same three Vault/KMS values
      # infra/ansible/roles/app_deploy/tasks/main.yml would otherwise try
      # (and fail) to look up itself, since the runner has no Terraform
      # working directory of its own until this step creates one.
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Read Terraform outputs
        id: tf
        working-directory: infra/terraform
        run: |
          echo "app_server_public_ip=$(terraform output -raw app_server_public_ip)" >> "$GITHUB_OUTPUT"
          echo "vault_kms_key_id=$(terraform output -raw vault_unseal_key_id)" >> "$GITHUB_OUTPUT"
          echo "vault_kms_crypto_endpoint=$(terraform output -raw vault_kms_crypto_endpoint)" >> "$GITHUB_OUTPUT"
          echo "vault_kms_management_endpoint=$(terraform output -raw vault_kms_management_endpoint)" >> "$GITHUB_OUTPUT"

      # Ansible itself isn't in this repo's package.json anywhere — it's a
      # Python tool, installed fresh on the runner, same as it would be on
      # any machine that runs 'ansible-playbook' for the first time.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --user ansible

      # Loads the private key into an in-memory ssh-agent for this job only.
      # The key text lives in GitHub's encrypted Secrets store and is
      # injected at runtime — it never appears in this file, and GitHub
      # automatically redacts any secret value it recognizes in job logs.
      # Deliberately still its own separate GitHub Secret, not something
      # fetched from Infisical alongside everything else above: this is a
      # CI-specific deploy credential, not the same key any of the
      # developer-machine secrets under /ENV_VARS represent.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write Ansible inventory
        run: |
          cat > infra/ansible/inventory.ini <<EOF
          [web]
          ${{ steps.tf.outputs.app_server_public_ip }} ansible_user=ubuntu
          EOF

      - name: Run deploy playbook
        # The runner has never connected to this host before, so it has no
        # entry in its known_hosts file — StrictHostKeyChecking would
        # otherwise stop and wait for interactive confirmation that will
        # never come on a non-interactive runner.
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        # infra/ansible/deploy.sh (same script a developer runs by hand)
        # owns the actual '-e vault_agent_role_id=...' etc. list now — one
        # place to keep in sync with roles/app_deploy and roles/duckdns'
        # own required vars, not this file and a local script quietly
        # drifting apart (exactly what happened once already: this step
        # shipped without '-e duckdns_token', and only broke on the next
        # real deploy). $VAULT_AGENT_ROLE_ID/$DUCKDNS_TOKEN/etc. are
        # already exported by "Fetch secrets from Infisical" above — since
        # every one of deploy.sh's required vars is already set, it skips
        # sourcing import-secrets.sh entirely (that script assumes an
        # interactive 'infisical' CLI login this runner has no use for).
        # vault_kms_* are passed here as extra args instead: Terraform
        # outputs read as a separate step above, not something a Vault
        # AppRole/DuckDNS credential model fits alongside the rest.
        run: |
          infra/ansible/deploy.sh \
            -e vault_kms_key_id="${{ steps.tf.outputs.vault_kms_key_id }}" \
            -e vault_kms_crypto_endpoint="${{ steps.tf.outputs.vault_kms_crypto_endpoint }}" \
            -e vault_kms_management_endpoint="${{ steps.tf.outputs.vault_kms_management_endpoint }}"
