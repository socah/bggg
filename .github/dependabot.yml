version: 2

updates:

  # Scans apps/api/package-lock.json against the npm advisory database.
  # Skipped silently until a lockfile exists — safe to declare now.
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      # Keep all @nestjs/* packages on the same major version.
      # Without this, Dependabot bumps them individually — leaving the
      # ecosystem in a mixed-version state that breaks at runtime.
      nestjs:
        patterns: ["@nestjs/*"]
      # Batch routine patch bumps into one PR to reduce noise.
      # Security advisories always get their own PR regardless of this grouping.
      non-security-patches:
        update-types: ["patch"]
    ignore:
      # typescript 7.x is Microsoft's native/Go-ported compiler — a
      # different package shape (ESM-only, no classic Compiler API) that
      # @nestjs/cli, ts-node, and ts-jest don't support yet (only an
      # @nestjs/cli 12.0.0-alpha line exists so far). Blocks the major bump
      # only — 6.x patch/security updates still come through normally.
      # Remove once @nestjs/cli 12 is stable and ts-node/ts-jest support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Same for the Next.js frontend.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      non-security-patches:
        update-types: ["patch"]
    ignore:
      # Pinned to the same major as apps/api for consistency, though the
      # web build's actual breakage under typescript 7.x turned out to be
      # unrelated (a Turbopack/next-pwa incompatibility, fixed separately
      # via 'next build --webpack') — this ignore just avoids re-testing
      # an untested major bump here until apps/api's blockers clear.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Scans docker-compose.yml for 'image:' tags (e.g. postgres:16-alpine).
  # Dev-specific overrides live in docker-compose.dev.yml which Dependabot ignores
  # because it uses a non-standard filename — image tags belong in the base file.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Scans .devcontainer/devcontainer.json — both the base image and features.
  # Features (e.g. docker-in-docker) are versioned images on ghcr.io and can
  # carry CVEs just like any other container image.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
